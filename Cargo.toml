#:schema https://www.schemastore.org/cargo.json

[package]
name = "kestrel"
version = "0.3.3"
edition = "2024"
license-file = "LICENSE.md"

[dependencies]
avian_fdm = { git = "https://github.com/wesfly/avian_fdm", default-features = false, features = ["f64"] }
avian3d = {
  version = "0.7.0",
  default-features = false,
  features = [
    "3d",
    "bevy_picking",
    "collider-from-mesh",
    "debug-plugin",
    "f64",
    "parry-f64",
    "xpbd_joints"
  ]
}
bevy = {
  version = "0.19.0",
  default-features = false,
  features = [
    "3d",
    "bevy_dev_tools",
    "free_camera",
    "ui",
    "bevy_feathers",
  ]
}
big_space = { git = "https://github.com/wesfly/big_space" }
chrono = "0.4.45"
dashmap = "6.2.1"
futures = "0.3.33"
image = { version = "0.25.10", features = ["default-formats", "rayon", "webp"] }
kestrel_osm = { git = "https://github.com/wesfly/kestrel_osm" }
once_cell = "1.21.4"
reqwest = { version = "0.13.4" }
serde = "1.0.228"
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["full"] }
earcut = "0.4.11"
bevy_skein = "0.6.0"

[lints.clippy]
all = { level = "allow", priority = -2 }
correctness = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
